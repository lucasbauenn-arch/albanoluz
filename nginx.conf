server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml;

  # Cabeçalhos de segurança (os mesmos de public/_headers, usado no Cloudflare Pages).
  # O nginx só herda add_header do server quando o location não define nenhum;
  # por isso /assets/ e /admin repetem a lista inteira.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # URLs limpas: /sobre → sobre.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  location /admin {
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files /admin.html =404;
  }

  # Obras novas (ainda não pré-renderizadas) e rotas inexistentes. A resposta sai
  # com status 404 até o próximo build gerar a página (ver README → Novo deploy).
  error_page 404 /404.html;
}
